<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>폭별 확인</title>
<style>
  html, body { margin: 0; background: #d9dcd6; }
  iframe { display: block; border: 0; background: #fff; height: 100vh; }
  .bar { font: 12px system-ui; padding: 6px 10px; color: #333; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<iframe id="f" title="앱 미리보기"></iframe>
<script>
  // ?w=1280&h=640&path=%23%2Frecommend 처럼 쓴다. 같은 오리진이라 미디어 쿼리가 iframe 크기 기준으로 동작한다.
  // h 를 주면 iframe 높이를 고정한다(노트북 배율 높이 확인용).
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w')) || 1440;
  const h = Number(q.get('h'));
  const hash = q.get('path') || '';
  const f = document.getElementById('f');
  f.style.width = w + 'px';
  if (h) f.style.height = h + 'px';
  // s=0.6 처럼 주면 창이 좁아도 전체가 한 장에 담기게 줄여 보여 준다(미디어 쿼리는 iframe 크기 그대로).
  const s = Number(q.get('s'));
  if (s) { f.style.transform = 'scale(' + s + ')'; f.style.transformOrigin = '0 0'; }
  f.src = './' + hash;
  document.getElementById('bar').textContent = 'iframe ' + w + (h ? '×' + h : '') + 'px ' + (hash ? '· ' + hash : '');
</script>
</body>
</html>
