name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
      # 레이아웃 검사: 모든 경로 × 크기 × 학생 상태. 한글 대체 글꼴(Noto CJK)을 깔아 글꼴 CDN 이 막혀도 글자 폭이 비슷하게 잡히게 한다.
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run audit:layout -- --no-build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-audit
          path: .qa/layout
          retention-days: 7
          if-no-files-found: ignore
